<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact All in Juan Vital Sign for inquiries, support, and partnership opportunities.">
    <title>Contact Us | All in Juan Vital Sign</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <img class="logo" src="/pictures/logo.png" alt="All in Juan Vital Sign Logo">
            <div class="title">All in Juan Vital Sign</div>
            <div class="menu-toggle" id="menu-toggle">&#9776;</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero" style="background-image: url('/pictures/contact-hero.jpg');">
            <div class="hero-content">
                <h1>Contact Us</h1>
                <p>We'd love to hear from you. Get in touch!</p>
            </div>
        </section>

        <!-- Contact Form Section -->
        <section class="section contact-form-section">
            <h2>Send us a Message</h2>
            <form class="contact-form" id="contactForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Juan Dela Cruz" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="juan@example.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+63 912 345 6789">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="How can we help you?" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Tell us more about your inquiry..."
                        required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </section>

        <!-- Additional Contact Info -->
        <section class="section contact-info-section">
            <h2>Other Ways to Reach Us</h2>
            <div class="contact-info-grid">
                <div class="contact-card">
                    <h3>📧 Email</h3>
                    <p>info@allinjuan.ph</p>
                </div>
                <div class="contact-card">
                    <h3>📞 Phone</h3>
                    <p>+63 912 345 6789</p>
                </div>
                <div class="contact-card">
                    <h3>📍 Location</h3>
                    <p>Manila, Philippines</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks = document.getElementById('nav-links');
        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        const contactForm = document.getElementById('contactForm');
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Thank you for your message! We will get back to you soon.');
            contactForm.reset();
        });
    </script>
</body>

</html>
